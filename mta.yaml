_schema-version: "3.3"
ID: integration-portal
version: 0.1.0
description: Enterprise operations & observability platform for SAP Integration Suite (stateless)

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm run build

modules:
  # -------------------------------------------------------------------------
  # Backend: stateless Node.js + Express API (no database binding)
  # -------------------------------------------------------------------------
  - name: integration-portal-srv
    type: nodejs
    path: srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: custom
      commands:
        - npm ci
        - npm run build
        # config/ lives at the repo root, outside this module's `path: srv`, so it is never
        # otherwise part of the deployed droplet. Copy it into the module's own tree here so
        # ConfigService's runtime lookup (which walks up from process.cwd(), i.e. the droplet
        # root on CF) finds it at /home/vcap/app/config with no code change or CONFIG_DIR needed.
        - 'node -e "require(''fs'').cpSync(''../config'', ''./config'', { recursive: true })"'
      ignore:
        - node_modules/
        - src/
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: integration-portal-xsuaa
      - name: integration-portal-destination

  # -------------------------------------------------------------------------
  # App Router: serves UI5 app from HTML5 repo, routes /api/* to backend
  # -------------------------------------------------------------------------
  - name: integration-portal-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: integration-portal-xsuaa
      - name: integration-portal-destination
      - name: integration-portal-html5-repo-runtime
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  # -------------------------------------------------------------------------
  # UI5 frontend — builds the app itself. MBT does not auto-zip a module's
  # build-result; the explicit zip command below produces app-content.zip,
  # which the content-deployer module pulls in via `build-parameters.requires`.
  # -------------------------------------------------------------------------
  - name: integration-portal-app
    type: html5
    path: app
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
        # The content-deployer module below copies raw files/folders out of this module's
        # build-result (dist/) as-is — it never zips anything on its own. To end up with the
        # single inner zip the HTML5 Application Repository requires per app (manifest.json at
        # its root, not nested under a dist/ prefix), we have to produce that zip ourselves here.
        # MBT execs each command directly (no shell), so inline "cd x && y" doesn't work — hence
        # the wrapper script.
        - sh scripts/zip-content.sh
      supported-platforms: []

  # -------------------------------------------------------------------------
  # Destination content — tags the html5-repo-host and xsuaa service
  # instances with a shared sap.cloud.service value via destinations in the
  # destination service. Approuter's dynamic routing to html5-apps-repo-rt
  # resolves "which app" through this tag; without it, content can deploy
  # successfully yet still be unreachable (approuter logs "Service Tag index
  # is unknown" and every request 503s even though the app is registered).
  # manifest.json's sap.cloud.service must match the same value.
  # -------------------------------------------------------------------------
  - name: integration-portal-destination-content
    type: com.sap.application.content
    requires:
      - name: integration-portal-xsuaa
      - name: integration-portal-html5-repo-host
      - name: integration-portal-destination
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          destinations:
            - Name: integration-portal-html5-repo-host
              ServiceInstanceName: integration-portal-html5-repo-host
              ServiceKeyName: integration-portal-html5-repo-host-key
              sap.cloud.service: integration-portal
            - Name: integration-portal-xsuaa
              ServiceInstanceName: integration-portal-xsuaa
              ServiceKeyName: integration-portal-xsuaa-key
              sap.cloud.service: integration-portal
              Authentication: OAuth2UserTokenExchange
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  # -------------------------------------------------------------------------
  # Content deployer — pushes the built UI5 app into the HTML5 Application
  # Repository. `type: com.sap.application.content` packages/pushes content
  # that ANOTHER module already built; it does not build anything itself —
  # running its own `npm ci`/`npm run build` here (the previous shape of
  # this module) executed fine but produced no artifact MBT recognized as
  # this module's own deployable content, so it silently never made it into
  # the .mtar and `cf deploy` never had anything to push.
  # -------------------------------------------------------------------------
  - name: integration-portal-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: integration-portal-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: integration-portal-app
          artifacts:
            - '*.zip'
          target-path: resources/

resources:
  - name: integration-portal-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: integration-portal-${org}-${space}
      service-keys:
        - name: integration-portal-xsuaa-key

  - name: integration-portal-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: integration-portal-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-keys:
        - name: integration-portal-html5-repo-host-key

  - name: integration-portal-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
