specVersion: "3.1"
metadata:
  name: com.middlewareops.integrationportal
type: application
framework:
  name: SAPUI5
  version: "1.120.27"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.table
    - name: sap.ui.comp
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: false
        omitSourceMaps: true
        transpileAsync: true
        transpileTypeScript: true
  # Test assets (QUnit/OPA) are dev-only and must not ship in the production build output.
  resources:
    excludes:
      - "/test/**"
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: false
        transpileAsync: true
        transpileTypeScript: true
    - name: fiori-tools-proxy
      afterMiddleware: ui5-tooling-transpile-middleware
      configuration:
        ignoreCertError: false
        backend:
          - path: /api
            url: http://localhost:4004
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    # Live reload on source change (developer-experience only; safe to remove).
    - name: fiori-tools-appreload
      afterMiddleware: fiori-tools-proxy
      configuration:
        port: 35729
        path: webapp
        delay: 300
