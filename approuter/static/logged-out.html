<!doctype html>
<!--
  Shown after a complete sign-out: the approuter has ended the portal session and XSUAA its own, so
  signing in again issues a fresh token with the user's current role collections. Served by the
  approuter itself without authentication (xs-app.json route, served from approuter/static), so it never triggers a new login.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signed out</title>
    <style>
      :root {
        --bg: #f5f6f7;
        --card: #ffffff;
        --text: #1d2d3e;
        --muted: #556b82;
        --accent: #0070f2;
        --border: rgba(127, 127, 127, 0.25);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12171c;
          --card: #1d232a;
          --text: #eaecee;
          --muted: #a9b4be;
          --accent: #4db1ff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family: "72", "72full", Arial, Helvetica, sans-serif;
      }
      main {
        max-width: 28rem;
        width: 100%;
        padding: 2rem;
        border-radius: 1rem;
        background: var(--card);
        border: 1px solid var(--border);
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-block;
        padding: 0.6rem 1.25rem;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are signed out</h1>
      <p>
        Your Integration Portal session has ended. Signing in again picks up any role collections
        that were assigned to you in the meantime.
      </p>
      <a href="/">Sign in again</a>
    </main>
  </body>
</html>
