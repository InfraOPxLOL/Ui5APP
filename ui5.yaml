specVersion: "3.1"
metadata:
  name: integrationsuite.ui5app
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /odata/v2/integrationsuite
            # TODO: replace with the real Integration Suite OData service URL,
            # e.g. https://<tenant>.it-cpi<...>.cfapps.<region>.hana.ondemand.com/http/<path>
            url: https://your-integration-suite-tenant.example.com/http/your-odata-service
            # Basic Auth credentials are NOT stored here. fiori-tools-proxy will
            # prompt for username/password on first "npm start" and cache them
            # via the OS credential store. See README for details.
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: integrationsuite.ui5app
        ui5Theme: sap_horizon
